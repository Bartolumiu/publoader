# Publoader worker host.
#
#   cp .env.example .env      # set ENROLL_TOKEN + WORKER_NAME
#   docker compose -f platform/docker/worker/docker-compose.yml up -d
#
# This is what a volunteer or a secondary machine runs. It is deliberately the
# smallest thing in the system: one container, one outbound HTTPS connection,
# no inbound anything, no database, no credentials beyond a revocable worker
# token scoped to /api/v1/worker/* on this one deployment.
#
# What the agent does: exchanges the enroll token for a worker token (once),
# then long-polls the core API for a job, downloads the pinned extension
# bundle, verifies its sha256, runs it through the Python runner shim, and
# submits the result envelope. It never uploads to MangaDex — only the
# operator's core-uploader can do that (§8).
#
# What a compromised worker gets an attacker: the job inputs (non-secret
# tracked ids) and the ability to submit plausible-but-false results, which are
# schema-validated, deduped MangaDex-side, quarantinable and audited. It gets
# no credentials, no other worker's data, and no path into the core host.

# Named explicitly so the stack is identifiable in `docker compose ls` rather
# than showing up as "worker". Override with `-p` to run several workers on one
# machine (see docs/deployment.md "Scaling to multiple workers").
name: publoader-worker

services:
  worker-agent:
    # Built from this repo by default. Once images are published, set
    # PUBLOADER_WORKER_IMAGE to a digest-pinned tag in .env and remove nothing
    # else — worker hosts should not need a source checkout to run.
    image: ${PUBLOADER_WORKER_IMAGE:-ardax/publoader-worker:2.1.1}
    build:
      context: ../..
      dockerfile: docker/worker/Dockerfile
      # No build args: extensions are self-contained ESM bundles built at
      # publish time, so the image has no per-extension dependencies to bake in
      # and adding an extension no longer requires rebuilding workers.
    # No `container_name:` on purpose — a fixed name would make it impossible
    # to run a second worker on the same machine with `-p`, since the two
    # projects would collide on the container name.
    restart: unless-stopped

    environment:
      # Public control-plane URL. HTTPS is not optional: the worker token is a
      # bearer credential and travels on every request.
      CORE_URL: ${CORE_URL:-https://publoader.ardax.dev}
      # How this host appears in `admin/workers` and in the audit log. Use
      # something you will recognise at 3am ("hetzner-fsn-1", "arda-desktop").
      WORKER_NAME: ${WORKER_NAME:?set WORKER_NAME in .env}
      # FIRST BOOT ONLY: single-use, expiring token minted by the operator. The
      # agent exchanges it for a permanent worker token and persists that to
      # the state volume; the enroll token is then spent and can be removed
      # from .env. Leave both unset and the agent has no way to authenticate.
      ENROLL_TOKEN: ${ENROLL_TOKEN:-}
      # Set this INSTEAD of ENROLL_TOKEN to re-attach an existing identity
      # (e.g. after wiping the state volume, or when the operator provisions
      # the token out of band). Normally you never set it by hand.
      WORKER_TOKEN: ${WORKER_TOKEN:-}
      WORKER_STATE_PATH: /var/lib/publoader-worker
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RUNNER_EXTRA_ARGS: ${RUNNER_EXTRA_ARGS:-}
      # How stale the liveness heartbeat may get before the container is marked
      # unhealthy. Raise it only if you also raised the core's LEASE_TTL_SECONDS
      # — the agent renews a lease every TTL/3, and that is the slowest signal
      # the heartbeat has while a long job runs.
      WORKER_HEARTBEAT_MAX_AGE_SECONDS: ${WORKER_HEARTBEAT_MAX_AGE_SECONDS:-600}

    volumes:
      # The worker token and bundle cache. A named volume, not a bind mount, so
      # the token file is not sitting in a directory someone browses; losing it
      # is recoverable (re-enroll with a fresh token, revoke the old worker).
      - worker-state:/var/lib/publoader-worker

    # NO `ports:` AND NO `expose:` — BY DESIGN. The agent is outbound-only: it
    # long-polls the core API and never listens. There is nothing to reach on
    # this host, so a worker can live behind NAT, on a laptop, on a home
    # connection, with no firewall exception and no inbound attack surface.

    # --- runtime isolation (§8) ---------------------------------------------
    # This container executes third-party extension code, so the hardening here
    # is the actual security boundary and not box-ticking.

    # The image is complete; the agent writes only to the state volume and
    # /tmp. An extension that drops a file anywhere else fails, and nothing it
    # does survives a restart.
    read_only: true
    tmpfs:
      # Per-job scratch: unpacked bundles, downloaded images, runner cwd.
      # noexec blocks executing a downloaded payload; nosuid blocks setuid
      # tricks; the size cap stops a runaway extension eating host RAM (tmpfs
      # is memory, and it counts against mem_limit).
      - /tmp:rw,noexec,nosuid,nodev,size=2g
    cap_drop:
      # An extension scraping a website needs no kernel capability whatsoever.
      - ALL
    security_opt:
      - no-new-privileges:true

    # Resource limits are containment, not just tidiness: a hostile or merely
    # broken extension must not be able to take the host down.
    mem_limit: ${WORKER_MEM_LIMIT:-2g}
    # Swap limit == mem limit disables swap for this container, so an
    # over-memory extension is OOM-killed promptly instead of thrashing the
    # host's disk.
    memswap_limit: ${WORKER_MEM_LIMIT:-2g}
    cpus: ${WORKER_CPUS:-2.0}
    # Fork-bomb ceiling. The agent plus one python subprocess needs a few
    # dozen; 512 is generous and still bounded.
    pids_limit: 512
    # Same reasoning as the memory cap, for file descriptors.
    ulimits:
      nofile:
        soft: 4096
        hard: 8192

    # Give an in-flight job a chance to finish or to report failure cleanly on
    # `compose down`. If it does not, the core's lease sweeper reclaims the job
    # after LEASE_TTL_SECONDS and hands it to another worker — an abrupt kill
    # loses nothing but time.
    stop_grace_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    # Uses the image's HEALTHCHECK: the agent's heartbeat file must stay fresh.
    # Catches the failure mode restart-on-exit cannot — an agent that stays
    # "running" forever while its lease loop no longer turns. Docker only
    # *reports* unhealthy; nothing restarts on it, so watch `docker compose ps`
    # or scrape the docker socket from outside this stack. An autoheal sidecar
    # would need docker.sock mounted into the worker host, which is a worse
    # trade than the failure it fixes (same reasoning as the core stack).

volumes:
  # Holds the worker's identity. Deleting it means re-enrolling (and leaves a
  # stale worker record on the core side — revoke it there).
  worker-state: {}
